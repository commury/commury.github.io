<!DOCTYPE html>
<html lang="en">
<head>
    <title>website</title>
</head>
<body>
    <p>hiy</p>
	<h1>my clicker</h1>
	<button id="click">click</button>
	<br>
	<p id="counter">0</p>
	
	<script>
	let count = 0;
	
	let click = document.getElementById("click");
	let counter = document.getElementById("counter");
	click.onclick = function () {
		count++;
		counter.textContent = count;
	}
	</script>
</body>
</html>
